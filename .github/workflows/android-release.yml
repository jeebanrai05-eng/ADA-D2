name: JARVIS Android Release & OTA Update (v1.1.1)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 1.1.1)'
        required: true
        default: '1.1.1'
      release_notes:
        description: 'Release notes summary'
        required: false
        default: 'JARVIS AI v1.1.1 Signed Release with OTA version.json manifest'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK Licenses (No sdkmanager Needed)
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_SDK}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK}" >> $GITHUB_ENV
          mkdir -p "${ANDROID_SDK}/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "${ANDROID_SDK}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "${ANDROID_SDK}/licenses/android-sdk-preview-license"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure APK Signing Keystore (GitHub Secrets or Safe Debug Fallback)
        id: signing_setup
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Using release signing credentials from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            if [ -f "signing/jarvis-signing-key.b64" ]; then
              tr -d '[:space:]' < signing/jarvis-signing-key.b64 | base64 -d > "${GITHUB_WORKSPACE}/debug.keystore"
            else
              keytool -genkeypair -v \
                -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "build_task=assembleRelease" >> $GITHUB_OUTPUT
            echo "apk_dir=app/build/outputs/apk/release" >> $GITHUB_OUTPUT
          else
            echo "Release signing secrets not configured; using safe signed debug build configuration..."
            if [ -f "signing/jarvis-signing-key.b64" ]; then
              tr -d '[:space:]' < signing/jarvis-signing-key.b64 | base64 -d > "${GITHUB_WORKSPACE}/debug.keystore"
              echo "Restored persistent keystore from signing/jarvis-signing-key.b64"
            else
              keytool -genkeypair -v \
                -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "Generated safe fallback debug.keystore via keytool"
            fi
            echo "build_task=assembleDebug" >> $GITHUB_OUTPUT
            echo "apk_dir=app/build/outputs/apk/debug" >> $GITHUB_OUTPUT
          fi

      - name: Prepare .env from Repository Secrets
        env:
          OPENAI_SECRET: ${{ secrets.OPENAI_API_KEY }}
          SEARCH_SECRET: ${{ secrets.SEARCH_API_KEY }}
          ELEVEN_SECRET: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_SECRET: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          cp .env.example .env
          if [ -n "$OPENAI_SECRET" ]; then
            sed -i "s|OPENAI_API_KEY=.*|OPENAI_API_KEY=${OPENAI_SECRET}|" .env
          fi
          if [ -n "$SEARCH_SECRET" ]; then
            sed -i "s|SEARCH_API_KEY=.*|SEARCH_API_KEY=${SEARCH_SECRET}|" .env
          fi
          if [ -n "$ELEVEN_SECRET" ]; then
            sed -i "s|ELEVENLABS_API_KEY=.*|ELEVENLABS_API_KEY=${ELEVEN_SECRET}|" .env
          fi
          if [ -n "$VOICE_SECRET" ]; then
            sed -i "s|ELEVENLABS_VOICE_ID=.*|ELEVENLABS_VOICE_ID=${VOICE_SECRET}|" .env
          fi

      - name: Build Signed APK (v1.1.1)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle ${{ steps.signing_setup.outputs.build_task }} --stacktrace

      - name: Package Signed APK & Generate version.json
        id: package_release
        run: |
          RAW_VERSION="${{ github.event.inputs.release_version || '1.1.1' }}"
          CLEAN_VERSION="${RAW_VERSION#v}"
          VERSION_TAG="v${CLEAN_VERSION}"
          APK_NAME="JARVIS-AI-${VERSION_TAG}.apk"

          BUILT_APK=$(find "${{ steps.signing_setup.outputs.apk_dir }}" -name "*.apk" | head -n 1)
          if [ -z "$BUILT_APK" ]; then
            echo "ERROR: No APK found in ${{ steps.signing_setup.outputs.apk_dir }}"
            exit 1
          fi
          cp "$BUILT_APK" "${APK_NAME}"
          APK_SHA256=$(sha256sum "${APK_NAME}" | awk '{print $1}')

          cat > version.json <<EOF
          {
            "appName": "JARVIS AI (ADA v2)",
            "packageName": "com.aistudio.adaassistant.jarvis",
            "versionName": "${CLEAN_VERSION}",
            "versionCode": 111,
            "releaseTag": "${VERSION_TAG}",
            "releaseDate": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "minSdk": 24,
            "targetSdk": 36,
            "mandatoryUpdate": false,
            "apkFileName": "${APK_NAME}",
            "apkSha256Checksum": "${APK_SHA256}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/${VERSION_TAG}/${APK_NAME}",
            "releasePageUrl": "https://github.com/${{ github.repository }}/releases/tag/${VERSION_TAG}",
            "versionJsonUrl": "https://raw.githubusercontent.com/${{ github.repository }}/main/version.json",
            "signingCertificate": {
              "keyAlias": "androiddebugkey",
              "keystoreBackupFile": "signing/jarvis-signing-key.b64",
              "sha1": "1A:8D:F9:BB:89:5C:A3:A4:A4:80:91:9F:45:A9:B2:31:4D:08:1B:78",
              "sha256": "09:08:34:A8:C9:F8:AD:9F:B6:9B:C0:08:2F:8D:DD:B1:B3:51:CD:3F:B9:07:ED:FB:82:3C:57:A0:B9:D9:49:7D"
            },
            "changelog": [
              "Release ${VERSION_TAG}: Signed Android APK with OTA version.json manifest",
              "APK SHA-256 Checksum: ${APK_SHA256}"
            ]
          }
          EOF

          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "apk_sha256=${APK_SHA256}" >> $GITHUB_OUTPUT

      - name: Upload Signed APK & Certificate Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-${{ steps.package_release.outputs.version_tag }}-Release-Bundle
          path: |
            ${{ steps.package_release.outputs.apk_name }}
            version.json
            signing/signing-certificate-info.json
            signing/SIGNING_README.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_release.outputs.version_tag }}
          name: "JARVIS AI ${{ steps.package_release.outputs.version_tag }}"
          body: |
            ## JARVIS AI ${{ steps.package_release.outputs.version_tag }} — Signed Android Release
            - **Package Name**: `com.aistudio.adaassistant.jarvis`
            - **Version**: `${{ steps.package_release.outputs.version_tag }}` (`versionCode: 111`)
            - **APK SHA-256 Checksum**: `${{ steps.package_release.outputs.apk_sha256 }}`
            - **Signing Certificate SHA-1**: `1A:8D:F9:BB:89:5C:A3:A4:A4:80:91:9F:45:A9:B2:31:4D:08:1B:78`
            - **Signing Certificate SHA-256**: `09:08:34:A8:C9:F8:AD:9F:B6:9B:C0:08:2F:8D:DD:B1:B3:51:CD:3F:B9:07:ED:FB:82:3C:57:A0:B9:D9:49:7D`
          files: |
            ${{ steps.package_release.outputs.apk_name }}
            version.json
            signing/signing-certificate-info.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
