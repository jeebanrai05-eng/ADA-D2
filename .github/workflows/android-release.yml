
name: JARVIS Android Release & OTA Update (v1.1.1)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 1.1.1)'
        required: true
        default: '1.1.1'

      release_notes:
        description: 'Release notes summary'
        required: false
        default: 'JARVIS AI v1.1.1 Signed Release with OTA version.json manifest'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java setup
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV

      - name: Accept Android Licenses
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" \
            -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      # 4. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. Configure persistent signing key
      - name: Configure Persistent Android Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/debug.keystore"

          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE"
            echo "Persistent keystore restored from GitHub Secrets."

          elif [ -f "signing/jarvis-signing-key.b64" ]; then
            tr -d '[:space:]' < signing/jarvis-signing-key.b64 | base64 -d > "$KEYSTORE"
            echo "Persistent keystore restored from repository."

          else
            echo "WARNING: No persistent keystore found."
            echo "Generating a new debug keystore."

            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=JARVIS AI,O=JARVIS,C=US"
          fi

          # Validate keystore
          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          chmod 600 "$KEYSTORE"

          echo "Signing keystore successfully configured."

      # 6. Prepare environment
      - name: Prepare Environment
        env:
          OPENAI_SECRET: ${{ secrets.OPENAI_API_KEY }}
          SEARCH_SECRET: ${{ secrets.SEARCH_API_KEY }}
          ELEVEN_SECRET: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_SECRET: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(".env")
          content = path.read_text()

          values = {
              "OPENAI_API_KEY": os.getenv("OPENAI_SECRET", ""),
              "SEARCH_API_KEY": os.getenv("SEARCH_SECRET", ""),
              "ELEVENLABS_API_KEY": os.getenv("ELEVEN_SECRET", ""),
              "ELEVENLABS_VOICE_ID": os.getenv("VOICE_SECRET", "")
          }

          for key, value in values.items():
              if value:
                  lines = content.splitlines()
                  found = False

                  for i, line in enumerate(lines):
                      if line.startswith(key + "="):
                          lines[i] = key + "=" + value
                          found = True

                  if not found:
                      lines.append(key + "=" + value)

                  content = "\n".join(lines) + "\n"

          path.write_text(content)
          PY

      # 7. Build APK
      - name: Build Signed APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      # 8. Locate APK and verify signing
      - name: Verify APK Signature
        id: verify_apk
        run: |
          APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found!"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          CERT=$("$APKSIGNER" verify --print-certs "$APK")

          SHA1=$(echo "$CERT" | awk '/certificate SHA-1 digest:/ {print $NF; exit}')
          SHA256=$(echo "$CERT" | awk '/certificate SHA-256 digest:/ {print $NF; exit}')

          if [ -z "$SHA1" ] || [ -z "$SHA256" ]; then
            echo "ERROR: Unable to read APK signing certificate!"
            exit 1
          fi

          echo "APK=$APK" >> $GITHUB_ENV
          echo "CERT_SHA1=$SHA1" >> $GITHUB_ENV
          echo "CERT_SHA256=$SHA256" >> $GITHUB_ENV

          echo "APK signature verified successfully."
          echo "SHA1: $SHA1"
          echo "SHA256: $SHA256"

      # 9. Generate release package and OTA manifest
      - name: Generate APK & version.json
        id: package_release
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          REPOSITORY: ${{ github.repository }}
        run: |
          RAW_VERSION="${RELEASE_VERSION:-1.1.1}"
          CLEAN_VERSION="${RAW_VERSION#v}"

          VERSION_TAG="v${CLEAN_VERSION}"
          APK_NAME="JARVIS-AI-${VERSION_TAG}.apk"

          cp "$APK" "$APK_NAME"

          APK_SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          FILE_SIZE=$(stat -c%s "$APK_NAME")

          mkdir -p signing

          cat > version.json <<EOF
          {
            "appName": "JARVIS AI (ADA v2)",
            "packageName": "com.aistudio.adaassistant.jarvis",
            "versionName": "${CLEAN_VERSION}",
            "versionCode": 111,
            "releaseTag": "${VERSION_TAG}",
            "releaseDate": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "minSdk": 24,
            "targetSdk": 36,
            "mandatoryUpdate": false,
            "apkFileName": "${APK_NAME}",
            "apkSize": ${FILE_SIZE},
            "apkSha256Checksum": "${APK_SHA256}",
            "downloadUrl": "https://github.com/${REPOSITORY}/releases/download/${VERSION_TAG}/${APK_NAME}",
            "releasePageUrl": "https://github.com/${REPOSITORY}/releases/tag/${VERSION_TAG}",
            "versionJsonUrl": "https://raw.githubusercontent.com/${REPOSITORY}/main/version.json",
            "signingCertificate": {
              "keyAlias": "androiddebugkey",
              "sha1": "${CERT_SHA1}",
              "sha256": "${CERT_SHA256}"
            },
            "changelog": [
              "${RELEASE_NOTES:-JARVIS AI ${VERSION_TAG} signed release}",
              "APK SHA-256: ${APK_SHA256}"
            ]
          }
          EOF

          python3 -m json.tool version.json >/dev/null

          cat > signing/signing-certificate-info.json <<EOF
          {
            "keyAlias": "androiddebugkey",
            "sha1": "${CERT_SHA1}",
            "sha256": "${CERT_SHA256}"
          }
          EOF

          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "apk_sha256=$APK_SHA256" >> $GITHUB_OUTPUT

          echo "Release package generated successfully."

      # 10. Upload artifacts
      - name: Upload APK & Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-${{ steps.package_release.outputs.version_tag }}-Release-Bundle
          path: |
            ${{ steps.package_release.outputs.apk_name }}
            version.json
            signing/signing-certificate-info.json
          if-no-files-found: error
          retention-days: 30

      # 11. Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_release.outputs.version_tag }}
          name: JARVIS AI ${{ steps.package_release.outputs.version_tag }}
          body: |
            ## JARVIS AI ${{ steps.package_release.outputs.version_tag }}

            - Package: `com.aistudio.adaassistant.jarvis`
            - Version: `${{ steps.package_release.outputs.version_tag }}`
            - Version Code: `111`
            - APK SHA256: `${{ steps.package_release.outputs.apk_sha256 }}`
            - Signing: Verified Android APK
            - OTA: version.json included

          files: |
            ${{ steps.package_release.outputs.apk_name }}
            version.json
            signing/signing-certificate-info.json

          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 12. Complete
      - name: Release Summary
        run: |
          echo "=================================="
          echo "JARVIS AI RELEASE SUCCESSFUL"
          echo "=================================="
          echo "Version: ${{ steps.package_release.outputs.version_tag }}"
          echo "APK: ${{ steps.package_release.outputs.apk_name }}"
          echo "SHA256: ${{ steps.package_release.outputs.apk_sha256 }}"
          echo "Certificate SHA1: $CERT_SHA1"
          echo "Certificate SHA256: $CERT_SHA256"
          echo "=================================="
